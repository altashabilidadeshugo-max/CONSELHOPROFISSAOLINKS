<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação - Supervisor de Campo</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --accent: #3498db;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary);
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .emoji {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
        }
        .hidden {
            display: none !important;
        }
        .btn-back {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            background-color: #1a252f;
        }
        #stateContainer {
            max-width: 1000px;
            margin: 0 auto;
        }
        .state-link {
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .state-link:hover {
            background: var(--accent);
            color: white;
        }
    </style>
</head>
<body>

        <h1>Conselhos Profissionais - Validação</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar curso ou estado...">
    </div>

        <div id="courseContainer" class="grid"></div>

            <h2 id="selectedCourseTitle" style="text-align: center; margin-bottom: 20px;"></h2>
            <div id="stateGrid" class="grid"></div>
        </div>
    </main>

        const emojis = {
            "FARMÁCIA": "💊",
            "ENFERMAGEM": "🩺",
            "FISIOTERAPIA": "💆",
            "BIOMEDICINA": "🧬",
            "NUTRIÇÃO": "🍎",
            "SERVIÇO SOCIAL": "🤝",
            "RADIOLOGIA": "☢️",
            "QUIMICA": "⚗️",
            "OUTROS LINKS": "🔗"
        };

        const courseContainer = document.getElementById('courseContainer');
        const stateContainer = document.getElementById('stateContainer');
        const stateGrid = document.getElementById('stateGrid');
        const searchInput = document.getElementById('searchInput');
        const backBtn = document.getElementById('backBtn');
        const selectedCourseTitle = document.getElementById('selectedCourseTitle');
        
        let currentView = 'courses';
        let currentCourse = '';

        function renderCourses(filter = "") {
            courseContainer.innerHTML = '';
            const courses = Object.keys(bd_conselhos);
            
            courses.forEach(course => {
                if(course.toLowerCase().includes(filter.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="emoji">${emojis[course] || "🎓"}</div>
                        <div class="card-title">${course}</div>
                    `;
                    card.onclick = () => openCourse(course);
                    courseContainer.appendChild(card);
                }
            });
        }

        function renderStates(course, filter = "") {
            stateGrid.innerHTML = '';
            const states = bd_conselhos[course];
            
            Object.keys(states).forEach(state => {
                if(state.toLowerCase().includes(filter.toLowerCase())) {
                    let link = states[state];
                    const card = document.createElement('a');
                    card.className = 'card state-link';
                    
                    if(link.startsWith('http')) {
                        card.href = link;
                        card.target = '_blank';
                    } else {
                        // Trata links ausentes ou que constam apenas como texto na planilha
                        card.onclick = () => alert("Informação contida na base: " + link);
                    }
                    
                    card.innerHTML = `
                        <div class="emoji">📍</div>
                        <div class="card-title">${state}</div>
                    `;
                    stateGrid.appendChild(card);
                }
            });
        }

        function openCourse(course) {
            currentView = 'states';
            currentCourse = course;
            searchInput.value = '';
            searchInput.placeholder = `Pesquisar estado em ${course}...`;
            
            courseContainer.classList.add('hidden');
            stateContainer.classList.remove('hidden');
            selectedCourseTitle.textContent = `${emojis[course] || ""} Conselhos de ${course}`;
            
            renderStates(course);
        }

        backBtn.onclick = () => {
            currentView = 'courses';
            currentCourse = '';
            searchInput.value = '';
            searchInput.placeholder = 'Pesquisar curso ou estado...';
            
            stateContainer.classList.add('hidden');
            courseContainer.classList.remove('hidden');
            renderCourses();
        };

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if(currentView === 'courses') {
                renderCourses(val);
            } else {
                renderStates(currentCourse, val);
            }
        });

        // Inicia a aplicação
        renderCourses();
    </script>
</body>
</html>
